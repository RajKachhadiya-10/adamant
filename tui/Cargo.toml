[package]
name = "adamant"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Adamant terminal"

[[bin]]
name = "adamant"
path = "src/main.rs"

[dependencies]
bytes = "1"
crossterm = "0.28.1"
futures-util = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
